# Versão do Circle CI config file - ROGERIO Passos
version: 2.1
orbs:
  browser-tools: circleci/browser-tools@1.1.0
  aws-cli: circleci/aws-cli@3.1.4
  snyk: snyk/snky@1.4.0
jobs:

  build:
    docker:
      - image: cimg/node:22.22.3
    steps:
      - checkout
      - run: sudo npm install -g @angular/cli
      - run: sudo npm install -g grunt-cli
      - run: npm install --legacy-peer-deps
      - run: ls -la
      - persist_to_workspace:
          root: .
          paths:
            - ./*
  test:
    docker:
      - image: cimg/node:22.22.3-browsers
    steps:
      - attach_workspace:
          at: .
      - run: ls -la
      - run: sudo npm install -g @angular/cli
      - run: sudo npm install -g grunt-cli
      - run: npm run test:frontend && npm run test:server

 # Executa o Software composition Analysis
  test_sca:

    # Variaveis para integrar com Defect Dojo
    environment:
      APP_NAME: "juice-shop"
      DEFECT_DOJO_API_URL: "https://defectdojo.soulsec.net/api/v2/import-scan/"
      SCAN_TYPE: "Snyk Scan"
      REPORT_FILE: "report.json"

    docker:
      - image: cimg/node:22.22.3

    steps:
      - attach_workspace:
          at: .

      - snyk/scan:

          # Falha o build caso alguma vulnerabilidade seja encontrada
          fail-on-issues: true

          # Falha se encontrar alguma falha nesta severidade
          severity-threshold: high

          # Tire uma imagem instantânea das dependências atuais da aplicação para monitoramento contínuo pelo Snyk, se o teste foi bem-sucedido.
          monitor-on-build: true

          # Define o nome desse projeto para o scan
          project: '${CIRCLE_PROJECT_REPONAME}/${CIRCLE_BRANCH}'

          # Nome da Nome da variável de ambiente usada para armazenar o token de auth no Snyk
          token-variable: SNYK_TOKEN

          # Argumentos adicionais da CLI (https://docs.snyk.io/snyk-cli/cli-reference)
          # additional-arguments: '--fail-fast --all-projects'
          additional-arguments: '--json-file-output=report.json'      
  deploy:
    docker:
      - image: cimg/base:stable
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    steps:
     
      - setup_remote_docker

      - attach_workspace:
          at: .
      - aws-cli/setup:
          profile-name: default
      # Comandos para buildar a imagem docker e publicar no Docker HUB
      - run: docker build -t $DOCKERHUB_USERNAME/juice-shop-app:$CIRCLE_SHA1 -t $DOCKERHUB_USERNAME/juice-shop-app:latest ./ # Caminho de onde o Dockerfile é carregado
      - run: echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: docker push $DOCKERHUB_USERNAME/juice-shop-app:$CIRCLE_SHA1
      - run: docker push $DOCKERHUB_USERNAME/juice-shop-app:latest
      # Comandos para atualizar o ambiente no Elastic Beanstalk toda vez que uma nova imagem é publicada no docker hub
      - run:
          name: Deploy to Elastic Beanstalk
          command: |
            aws configure set region us-east-1
            aws s3 cp ebs-app-options.json s3://juice-shop-env-prod-rogerio
            aws elasticbeanstalk create-application-version --application-name juice-shop-app-prod --version-label $CIRCLE_SHA1 --source-bundle S3Bucket="juice-shop-env-prod-rogerio",S3Key="ebs-app-options.json"
            aws elasticbeanstalk update-environment --environment-name juice-shop-env-prod --version-label $CIRCLE_SHA1
workflows:
  build_test_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - test_sca:
          requires:
            - build
      - deploy-stg:
          requires:
            - test
            - test_sca
          filters:
            branches:
              ignore: master
      - deploy-prod:
          requires:
            - test
            - test_sca
